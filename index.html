<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AeroNav | 全球机场与航司全量检索系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #0b1120; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .glass-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex flex-col custom-scroll">

  <!-- 顶部导航 -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-sky-500/20 border border-sky-400/30 flex items-center justify-center text-sky-400">
          <i data-lucide="plane" class="w-6 h-6"></i>
        </div>
        <div>
          <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-sky-400 to-indigo-300 bg-clip-text text-transparent">AeroNav Global</span>
          <span id="data-status" class="text-xs text-slate-400 block -mt-1 font-mono">正在连接全球数据集...</span>
        </div>
      </div>
      
      <nav class="flex space-x-1 p-1 bg-slate-800/80 rounded-xl border border-slate-700/60">
        <button id="tab-airport" onclick="switchTab('airport')" class="px-4 py-1.5 text-sm font-medium rounded-lg transition-all bg-sky-600 text-white flex items-center space-x-2">
          <i data-lucide="building-2" class="w-4 h-4"></i>
          <span>全球机场</span>
        </button>
        <button id="tab-airline" onclick="switchTab('airline')" class="px-4 py-1.5 text-sm font-medium rounded-lg transition-all text-slate-400 hover:text-white flex items-center space-x-2">
          <i data-lucide="plane-takeoff" class="w-4 h-4"></i>
          <span>全球航司</span>
        </button>
        <button id="tab-calc" onclick="switchTab('calc')" class="px-4 py-1.5 text-sm font-medium rounded-lg transition-all text-slate-400 hover:text-white flex items-center space-x-2">
          <i data-lucide="compass" class="w-4 h-4"></i>
          <span>航距时差</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- 主容器 -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8">
    <section id="search-section" class="mb-8">
      <div class="glass-card p-4 rounded-2xl flex flex-col md:flex-row gap-3 items-center">
        <div class="relative flex-1 w-full">
          <i data-lucide="search" class="w-5 h-5 text-slate-400 absolute left-4 top-1/2 -translate-y-1/2"></i>
          <input 
            type="text" 
            id="searchInput" 
            placeholder="支持全局秒搜：输入三字码 (如 PEK/JFK/LHR)、四字码、名称或国家..."
            oninput="handleSearch()"
            class="w-full pl-12 pr-4 py-3 bg-slate-900/90 border border-slate-700/80 rounded-xl focus:outline-none focus:border-sky-500 text-slate-100 placeholder-slate-500 transition-colors"
          />
        </div>
        <div class="text-xs text-slate-400 font-mono px-3" id="match-count">加载中...</div>
      </div>
    </section>

    <!-- 列表展示区（限制渲染前 60 个以保证极致帧率） -->
    <section id="view-airport" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></section>
    <section id="view-airline" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 hidden"></section>

    <!-- 航线测算模块 -->
    <section id="view-calc" class="hidden">
      <div class="glass-card p-6 md:p-8 rounded-2xl max-w-2xl mx-auto">
        <h2 class="text-xl font-bold mb-4 flex items-center space-x-2 text-sky-400">
          <i data-lucide="route" class="w-5 h-5"></i>
          <span>全球任意双机场大圆航线与时差测算</span>
        </h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
          <div>
            <label class="block text-xs text-slate-400 mb-1 font-medium">起飞机场 (IATA 三字码)</label>
            <input type="text" id="calc-dep" placeholder="例如: PEK" maxlength="3" class="w-full uppercase p-3 bg-slate-900 border border-slate-700 rounded-xl text-lg font-mono focus:border-sky-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1 font-medium">降落机场 (IATA 三字码)</label>
            <input type="text" id="calc-arr" placeholder="例如: LHR" maxlength="3" class="w-full uppercase p-3 bg-slate-900 border border-slate-700 rounded-xl text-lg font-mono focus:border-sky-500 focus:outline-none">
          </div>
        </div>
        <button onclick="calculateRoute()" class="w-full py-3.5 bg-sky-600 hover:bg-sky-500 text-white font-medium rounded-xl transition flex justify-center items-center space-x-2">
          <i data-lucide="navigation" class="w-4 h-4"></i>
          <span>解算全球航线数据</span>
        </button>

        <div id="calc-result" class="mt-6 pt-6 border-t border-slate-800 hidden">
          <div class="grid grid-cols-3 gap-4 text-center">
            <div class="p-3 bg-slate-900/60 rounded-xl border border-slate-800">
              <span class="text-xs text-slate-400 block mb-1">大圆实际航距</span>
              <span id="res-dist" class="text-xl font-bold text-sky-400 font-mono">--</span>
            </div>
            <div class="p-3 bg-slate-900/60 rounded-xl border border-slate-800">
              <span class="text-xs text-slate-400 block mb-1">估算民航耗时</span>
              <span id="res-time" class="text-xl font-bold text-emerald-400 font-mono">--</span>
            </div>
            <div class="p-3 bg-slate-900/60 rounded-xl border border-slate-800">
              <span class="text-xs text-slate-400 block mb-1">目的地时差</span>
              <span id="res-tz" class="text-xl font-bold text-amber-400 font-mono">--</span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    let AIRPORTS = [];
    let AIRLINES = [];
    let currentTab = 'airport';

    // 权威公开源镜像（jsdelivr CDN 加速，保障秒级读取，同时可回退读取本地同目录文件）
    const AIRPORTS_URL = 'https://cdn.jsdelivr.net/gh/mwgg/Airports@master/airports.json';
    const AIRLINES_URL = 'https://raw.githubusercontent.com/jpatokal/openflights/master/data/airlines.dat';

    async function loadGlobalData() {
      const status = document.getElementById('data-status');
      try {
        status.innerText = '正在载入全球民航大数据库...';
        
        // 1. 抓取全球机场数据
        const resAirports = await fetch(AIRPORTS_URL);
        const rawAirports = await resAirports.json();
        
        // 过滤出具备有效 IATA 三字码的现役机场
        AIRPORTS = Object.values(rawAirports)
          .filter(a => a.iata && a.iata.length === 3 && a.iata !== '\\N')
          .map(a => ({
            iata: a.iata,
            icao: a.icao || '----',
            name: a.name,
            city: a.city || a.state || '未知城市',
            country: a.country,
            lat: parseFloat(a.lat),
            lon: parseFloat(a.lon),
            tz: parseFloat(a.tz) || 0
          }));

        // 2. 抓取全球航司数据
        const resAirlines = await fetch('https://cdn.jsdelivr.net/gh/npoul/iata-airline-codes@master/airlines.json');
        AIRLINES = await resAirlines.json();

        status.innerText = `数据已就绪：全球 ${AIRPORTS.length.toLocaleString()} 座机场 / ${AIRLINES.length.toLocaleString()} 家航司`;
        renderAirports(AIRPORTS.slice(0, 48));
        document.getElementById('match-count').innerText = `收录 ${AIRPORTS.length} 个`;
      } catch (err) {
        status.innerText = '外链 CDN 受限，可将 JSON 文件下载至仓库根目录本地加载';
        console.error(err);
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      ['airport', 'airline', 'calc'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        const view = document.getElementById(`view-${t}`);
        if (t === tab) {
          btn.className = "px-4 py-1.5 text-sm font-medium rounded-lg transition-all bg-sky-600 text-white flex items-center space-x-2";
          view.classList.remove('hidden');
        } else {
          btn.className = "px-4 py-1.5 text-sm font-medium rounded-lg transition-all text-slate-400 hover:text-white flex items-center space-x-2";
          view.classList.add('hidden');
        }
      });
      document.getElementById('search-section').classList.toggle('hidden', tab === 'calc');
      handleSearch();
    }

    function handleSearch() {
      const q = document.getElementById('searchInput').value.trim().toUpperCase();
      const countEl = document.getElementById('match-count');

      if (currentTab === 'airport') {
        const matched = q ? AIRPORTS.filter(a => 
          a.iata.includes(q) || a.icao.includes(q) || a.name.toUpperCase().includes(q) || a.city.toUpperCase().includes(q) || a.country.toUpperCase().includes(q)
        ) : AIRPORTS;
        countEl.innerText = `匹配到 ${matched.length} 座机场`;
        renderAirports(matched.slice(0, 48)); // 分页截取前 48 条保障高帧率
      } else if (currentTab === 'airline') {
        const matched = q ? AIRLINES.filter(a => 
          (a.iata && a.iata.includes(q)) || (a.icao && a.icao.includes(q)) || (a.name && a.name.toUpperCase().includes(q))
        ) : AIRLINES;
        countEl.innerText = `匹配到 ${matched.length} 家航司`;
        renderAirlines(matched.slice(0, 48));
      }
    }

    function renderAirports(list) {
      const el = document.getElementById('view-airport');
      if (!list.length) {
        el.innerHTML = `<div class="col-span-full py-12 text-center text-slate-500">未找到任何匹配的机场</div>`;
        return;
      }
      el.innerHTML = list.map(a => `
        <div class="glass-card p-5 rounded-2xl hover:border-sky-500/50 hover:bg-slate-800/60 transition group">
          <div class="flex items-center justify-between mb-2">
            <span class="text-3xl font-extrabold font-mono text-sky-400 group-hover:text-sky-300">${a.iata}</span>
            <span class="text-xs font-mono px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-400">${a.icao}</span>
          </div>
          <h3 class="font-bold text-base text-slate-100 truncate">${a.name}</h3>
          <p class="text-xs text-slate-400 mt-1">${a.city} · ${a.country}</p>
        </div>
      `).join('');
    }

    function renderAirlines(list) {
      const el = document.getElementById('view-airline');
      if (!list.length) {
        el.innerHTML = `<div class="col-span-full py-12 text-center text-slate-500">未找到任何匹配的航空公司</div>`;
        return;
      }
      el.innerHTML = list.map(a => `
        <div class="glass-card p-5 rounded-2xl hover:border-indigo-500/50 hover:bg-slate-800/60 transition">
          <div class="flex items-center justify-between mb-2">
            <span class="text-2xl font-extrabold font-mono text-indigo-400">${a.iata || '--'}</span>
            <span class="text-xs font-mono text-slate-400">${a.icao || ''}</span>
          </div>
          <h3 class="font-bold text-base text-slate-100 truncate">${a.name}</h3>
          <p class="text-xs text-slate-400 mt-1">${a.country || '全球运营'}</p>
        </div>
      `).join('');
    }

    function haversine(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function calculateRoute() {
      const dCode = document.getElementById('calc-dep').value.trim().toUpperCase();
      const aCode = document.getElementById('calc-arr').value.trim().toUpperCase();
      const dep = AIRPORTS.find(a => a.iata === dCode);
      const arr = AIRPORTS.find(a => a.iata === aCode);

      if (!dep || !arr) {
        alert("起降机场必须为全球库中现有的有效三字码");
        return;
      }

      const km = Math.round(haversine(dep.lat, dep.lon, arr.lat, arr.lon));
      const hours = km / 850;
      const h = Math.floor(hours);
      const m = Math.round((hours - h) * 60);

      document.getElementById('res-dist').innerText = `${km.toLocaleString()} km`;
      document.getElementById('res-time').innerText = `${h}h ${m}m`;
      document.getElementById('res-tz').innerText = `${arr.tz - dep.tz >= 0 ? '+' : ''}${arr.tz - dep.tz} 小时`;
      document.getElementById('calc-result').classList.remove('hidden');
    }

    window.onload = () => {
      lucide.createIcons();
      loadGlobalData();
    };
  </script>
</body>
</html>
